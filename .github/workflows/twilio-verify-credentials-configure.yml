name: Twilio Verify - Configure Key Vault Credentials

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Twilio Verify environment to configure
        required: true
        default: dev
        type: choice
        options: [dev, prd]
      confirmation:
        description: Enter APPLY olga-twilio-credentials-<environment>
        required: true
        type: string

permissions:
  contents: read

env:
  AZURE_CORE_OUTPUT: none

jobs:
  configure:
    name: Configure ${{ inputs.environment }} Twilio Verify credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    concurrency:
      # Share Terraform's apply lock so a credential pair cannot change while
      # a saved plan is updating the matching non-secret API key SID.
      group: terraform-apply-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify target and protected configuration
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          expected="APPLY olga-twilio-credentials-$DEPLOY_ENVIRONMENT"
          if [[ "$CONFIRMATION" != "$expected" ]]; then
            echo "::error::Confirmation must be exactly: $expected"
            exit 1
          fi
          if [[ "$DEPLOY_ENVIRONMENT" == "dev" && "$GITHUB_REF" != "refs/heads/develop" ]]; then
            echo "::error::Dev Twilio credential configuration must run from develop."
            exit 1
          fi
          if [[ "$DEPLOY_ENVIRONMENT" == "prd" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production Twilio credential configuration must run from main."
            exit 1
          fi
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required $DEPLOY_ENVIRONMENT GitHub Environment variable $name is not configured."
              exit 1
            fi
          done

      - name: Sign in to Azure with OIDC
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create or rotate the Key Vault secret versions
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          OLGA_TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
          OLGA_PHONE_AUTH_JWT_SIGNING_KEY: ${{ secrets.PHONE_AUTH_JWT_SIGNING_KEY }}
        run: |
          .\scripts\configure-twilio-verify-key-vault-secrets.ps1 `
            -Environment $env:DEPLOY_ENVIRONMENT `
            -SubscriptionId $env:AZURE_SUBSCRIPTION_ID

      - name: Publish value-free result
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          {
            echo "### Twilio Verify credentials configured"
            echo "- Environment: \`$DEPLOY_ENVIRONMENT\`"
            echo "- Two new Key Vault secret versions were written through the Azure control plane."
            echo "- No credential value was printed, passed to Terraform, or added to an artifact."
            echo "- Configure the non-secret \`TWILIO_VERIFY\` variable in the matching plan environment before enabling Core."
          } >> "$GITHUB_STEP_SUMMARY"
