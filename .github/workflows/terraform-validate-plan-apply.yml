name: Terraform - Validate, Plan, Apply

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options: [dev, prd]
      confirm_destroy:
        description: Allow a reviewed destructive dev deployment
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.14.6"
  TFLINT_VERSION: "0.64.0"
  TFLINT_SHA256: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
  TRIVY_VERSION: "0.72.0"
  TRIVY_SHA256: bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea

jobs:
  quality:
    name: Validate, lint, and scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      terraform_environment: ${{ steps.target.outputs.terraform_environment }}
    steps:
      - name: Select target environment
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            environment="$INPUT_ENVIRONMENT"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$BASE_REF" == "main" ]] && environment="prd" || environment="dev"
          else
            [[ "$REF_NAME" == "main" ]] && environment="prd" || environment="dev"
          fi
          [[ "$environment" == "prd" ]] && terraform_environment="prod" || terraform_environment="dev"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "terraform_environment=$terraform_environment" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without backend
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Install TFLint
        shell: bash
        run: |
          set -euo pipefail
          archive=tflint_linux_amd64.zip
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/$archive"
          echo "${TFLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/tflint"
          echo "$RUNNER_TEMP/tflint" >> "$GITHUB_PATH"

      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive --format compact

      - name: Install Trivy
        shell: bash
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$archive"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/trivy"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/trivy" trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"

      - name: Scan Terraform
        run: trivy config --exit-code 1 --severity HIGH,CRITICAL --format table .

  plan:
    name: Plan ${{ needs.quality.outputs.environment }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ format('{0}-plan', needs.quality.outputs.environment) }}
    concurrency:
      group: terraform-plan-${{ needs.quality.outputs.environment }}
      cancel-in-progress: ${{ needs.quality.outputs.environment == 'dev' }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
      TFSTATE_KEY: ${{ vars.TFSTATE_KEY }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_environment: ${{ needs.quality.outputs.terraform_environment }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_owner: ${{ vars.OWNER }}
      TF_VAR_expiry_date: ${{ vars.EXPIRY_DATE }}
    outputs:
      has_changes: ${{ steps.summary.outputs.has_changes }}
      destroy_count: ${{ steps.summary.outputs.destroy_count }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Verify environment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID \
            TFSTATE_RESOURCE_GROUP TFSTATE_STORAGE_ACCOUNT TFSTATE_CONTAINER TFSTATE_KEY \
            TF_VAR_location TF_VAR_owner TF_VAR_expiry_date; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required plan environment variable $name is not configured."
              exit 1
            fi
          done

      - name: Sign in to Azure with OIDC
        uses: Azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize remote state
        shell: bash
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$TFSTATE_KEY" \
            -backend-config="use_azuread_auth=true"

      - name: Create saved plan
        id: create
        shell: bash
        run: |
          set -euo pipefail
          mkdir plan
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -lock-timeout=5m \
            -out=plan/tfplan > "$RUNNER_TEMP/terraform-plan.log" 2>&1
          exit_code=$?
          set -e
          if [[ $exit_code -eq 1 ]]; then
            echo "::error::Terraform plan failed; output is suppressed to protect sensitive values."
            exit 1
          fi
          [[ $exit_code -eq 2 ]] && has_changes=true || has_changes=false
          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"

      - name: Create value-free plan summary
        id: summary
        shell: bash
        env:
          HAS_CHANGES: ${{ steps.create.outputs.has_changes }}
          DEPLOY_ENVIRONMENT: ${{ needs.quality.outputs.environment }}
        run: |
          set -euo pipefail
          terraform show -json plan/tfplan > "$RUNNER_TEMP/tfplan.json"
          create_count=$(jq '[.resource_changes[]? | select(.change.actions == ["create"])] | length' "$RUNNER_TEMP/tfplan.json")
          update_count=$(jq '[.resource_changes[]? | select(.change.actions == ["update"])] | length' "$RUNNER_TEMP/tfplan.json")
          replace_count=$(jq '[.resource_changes[]? | select((.change.actions | index("create")) != null and (.change.actions | index("delete")) != null)] | length' "$RUNNER_TEMP/tfplan.json")
          destroy_count=$(jq '[.resource_changes[]? | select((.change.actions | index("delete")) != null)] | length' "$RUNNER_TEMP/tfplan.json")
          {
            echo "### Terraform plan"
            echo "- Environment: \`$DEPLOY_ENVIRONMENT\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Create: $create_count"
            echo "- Update: $update_count"
            echo "- Replace: $replace_count"
            echo "- Includes delete: $destroy_count"
            [[ $destroy_count -eq 0 ]] || echo "- **Destructive change detected: review before approval.**"
            echo
            echo "Values and outputs are intentionally omitted."
          } > plan/plan-summary.md
          cat plan/plan-summary.md >> "$GITHUB_STEP_SUMMARY"
          (cd plan && sha256sum tfplan > tfplan.sha256)
          jq -n --arg commit "$GITHUB_SHA" --arg environment "$DEPLOY_ENVIRONMENT" \
            --arg version "$TERRAFORM_VERSION" --arg state_key "$TFSTATE_KEY" \
            '{commit: $commit, environment: $environment, terraform_version: $version, state_key: $state_key}' \
            > plan/manifest.json
          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
          echo "destroy_count=$destroy_count" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/tfplan.json" "$RUNNER_TEMP/terraform-plan.log"

      - name: Upload saved plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-plan-${{ needs.quality.outputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: plan/
          if-no-files-found: error
          retention-days: 2

      - name: Block unconfirmed destructive dev deployment
        if: >-
          github.event_name != 'pull_request' &&
          needs.quality.outputs.environment == 'dev' &&
          steps.summary.outputs.destroy_count != '0' &&
          !(github.event_name == 'workflow_dispatch' && inputs.confirm_destroy)
        env:
          DESTROY_COUNT: ${{ steps.summary.outputs.destroy_count }}
        run: |
          echo "::error::$DESTROY_COUNT destructive action(s) detected. Review the artifact, then use manual dispatch with confirm_destroy."
          exit 1

  apply:
    name: Apply ${{ needs.quality.outputs.environment }}
    if: >-
      github.event_name != 'pull_request' &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.has_changes == 'true'
    needs: [quality, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ needs.quality.outputs.environment }}
    concurrency:
      group: terraform-apply-${{ needs.quality.outputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
      TFSTATE_KEY: ${{ vars.TFSTATE_KEY }}
    steps:
      - name: Check out planned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Verify environment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID \
            TFSTATE_RESOURCE_GROUP TFSTATE_STORAGE_ACCOUNT TFSTATE_CONTAINER TFSTATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required apply environment variable $name is not configured."
              exit 1
            fi
          done

      - name: Sign in to Azure with OIDC
        uses: Azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize matching remote state
        shell: bash
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$TFSTATE_KEY" \
            -backend-config="use_azuread_auth=true"

      - name: Download saved plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terraform-plan-${{ needs.quality.outputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: plan

      - name: Verify plan provenance
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ needs.quality.outputs.environment }}
        run: |
          set -euo pipefail
          [[ "$(jq -r .commit plan/manifest.json)" == "$GITHUB_SHA" ]]
          [[ "$(jq -r .environment plan/manifest.json)" == "$DEPLOY_ENVIRONMENT" ]]
          [[ "$(jq -r .terraform_version plan/manifest.json)" == "$TERRAFORM_VERSION" ]]
          [[ "$(jq -r .state_key plan/manifest.json)" == "$TFSTATE_KEY" ]]
          (cd plan && sha256sum --check --strict tfplan.sha256)

      - name: Apply exact saved plan
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ needs.quality.outputs.environment }}
        run: |
          set -euo pipefail
          apply_log="$RUNNER_TEMP/terraform-apply.log"
          trap 'rm -f "$apply_log"' EXIT
          if terraform apply -input=false -no-color -lock-timeout=10m plan/tfplan > "$apply_log" 2>&1; then
            echo "Applied the reviewed \`$DEPLOY_ENVIRONMENT\` plan." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Terraform apply failed; output is suppressed to protect sensitive values."
            exit 1
          fi

  fork-plan-notice:
    name: Fork plan policy
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Cloud plans are disabled for fork pull requests because untrusted code must not receive Azure OIDC tokens."
