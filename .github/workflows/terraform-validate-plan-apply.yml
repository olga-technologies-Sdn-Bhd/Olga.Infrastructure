name: Terraform - Validate, Plan, Apply

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options: [dev, prd]

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.14.6"
  TFLINT_VERSION: "0.64.0"
  TFLINT_SHA256: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
  TRIVY_VERSION: "0.72.0"
  TRIVY_SHA256: bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea

jobs:
  quality:
    name: Validate, lint, and scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      terraform_environment: ${{ steps.target.outputs.terraform_environment }}
    steps:
      - name: Select target environment
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            environment="$INPUT_ENVIRONMENT"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$BASE_REF" == "main" ]] && environment="prd" || environment="dev"
          else
            [[ "$REF_NAME" == "main" ]] && environment="prd" || environment="dev"
          fi
          [[ "$environment" == "dev" || "$environment" == "prd" ]] || {
            echo "::error::Unsupported environment: $environment"
            exit 1
          }
          [[ "$environment" == "prd" ]] && terraform_environment="prod" || terraform_environment="dev"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "terraform_environment=$terraform_environment" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without backend
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Initialize External ID tenant bootstrap without backend
        run: terraform -chdir=bootstrap/external-tenant init -backend=false -input=false

      - name: Validate External ID tenant bootstrap
        run: terraform -chdir=bootstrap/external-tenant validate -no-color

      - name: Initialize External ID directory bootstrap without backend
        run: terraform -chdir=bootstrap/external-directory init -backend=false -input=false

      - name: Validate External ID directory bootstrap
        run: terraform -chdir=bootstrap/external-directory validate -no-color

      - name: Install TFLint
        shell: bash
        run: |
          set -euo pipefail
          archive=tflint_linux_amd64.zip
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/$archive"
          echo "${TFLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/tflint"
          echo "$RUNNER_TEMP/tflint" >> "$GITHUB_PATH"

      - name: Run TFLint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --format compact

      - name: Install Trivy
        shell: bash
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$archive"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/trivy"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/trivy" trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"

      - name: Scan Terraform
        run: trivy config --exit-code 1 --severity HIGH,CRITICAL --format table .

  plan:
    name: Plan ${{ needs.quality.outputs.environment }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ format('{0}-plan', needs.quality.outputs.environment) }}
    concurrency:
      group: terraform-plan-${{ needs.quality.outputs.environment }}
      cancel-in-progress: ${{ needs.quality.outputs.environment == 'dev' }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
      TFSTATE_KEY: ${{ vars.TFSTATE_KEY }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      TF_VAR_environment: ${{ needs.quality.outputs.terraform_environment }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_owner: ${{ vars.OWNER }}
      TF_VAR_cost_center: ${{ vars.COST_CENTER }}
      TF_VAR_expiry_date: ${{ vars.EXPIRY_DATE }}
      TF_VAR_budget_amount_usd: ${{ vars.BUDGET_AMOUNT_USD }}
      TF_VAR_budget_alert_emails: ${{ vars.BUDGET_ALERT_EMAILS }}
      TF_VAR_external_identity: ${{ vars.EXTERNAL_IDENTITY }}
      TF_VAR_external_tenant_id: ${{ vars.EXTERNAL_TENANT_ID }}
      TF_VAR_external_directory_client_id: ${{ vars.EXTERNAL_DIRECTORY_CLIENT_ID }}
      TF_VAR_use_oidc: "true"
      TF_VAR_tenant_subdomain: ${{ vars.EXTERNAL_TENANT_SUBDOMAIN }}
      TF_VAR_tenant_data_location: ${{ vars.EXTERNAL_TENANT_DATA_LOCATION }}
      TF_VAR_mobile_redirect_uri: ${{ vars.MOBILE_REDIRECT_URI }}
      TF_VAR_google_identity_provider_id: ${{ vars.GOOGLE_IDENTITY_PROVIDER_ID }}
      TF_VAR_apple_identity_provider_id: ${{ vars.APPLE_IDENTITY_PROVIDER_ID }}
    outputs:
      has_changes: ${{ steps.summary.outputs.has_changes }}
      external_directory_has_changes: ${{ steps.external_directory_plan.outputs.has_changes }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Verify environment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID \
            TFSTATE_RESOURCE_GROUP TFSTATE_STORAGE_ACCOUNT TFSTATE_CONTAINER TFSTATE_KEY \
            TF_VAR_tenant_id TF_VAR_location TF_VAR_owner TF_VAR_cost_center TF_VAR_expiry_date \
            TF_VAR_budget_amount_usd TF_VAR_budget_alert_emails TF_VAR_external_identity \
            TF_VAR_external_tenant_id TF_VAR_external_directory_client_id \
            TF_VAR_tenant_subdomain TF_VAR_tenant_data_location TF_VAR_mobile_redirect_uri \
            TF_VAR_google_identity_provider_id TF_VAR_apple_identity_provider_id; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required plan environment variable $name is not configured."
              exit 1
            fi
          done
          echo "TF_VAR_tenant_primary_domain=${TF_VAR_tenant_subdomain}.onmicrosoft.com" >> "$GITHUB_ENV"
          echo "EXTERNAL_DIRECTORY_STATE_KEY=olga/external-directory/${{ needs.quality.outputs.environment }}.tfstate" >> "$GITHUB_ENV"

      - name: Sign in to Azure with OIDC
        uses: Azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize remote state
        shell: bash
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$TFSTATE_KEY" \
            -backend-config="use_azuread_auth=true"

      - name: Create saved plan
        id: create
        shell: bash
        run: |
          set -euo pipefail
          mkdir plan
          set +e
          terraform plan -input=false -json -detailed-exitcode -lock-timeout=5m \
            -out=plan/tfplan | jq --unbuffered -r '
              if .type == "refresh_start" or
                 .type == "refresh_complete" or
                 .type == "planned_change" or
                 .type == "change_summary" then
                .["@message"] // empty
              elif .type == "diagnostic" then
                "Terraform \(.diagnostic.severity): \(.diagnostic.summary // "unspecified diagnostic")\nResource: \(.diagnostic.address // "not reported")"
              else
                empty
              end
            '
          pipeline_status=("${PIPESTATUS[@]}")
          exit_code=${pipeline_status[0]}
          filter_exit_code=${pipeline_status[1]}
          set -e
          if [[ $filter_exit_code -ne 0 ]]; then
            echo "::error::The Terraform plan event filter failed with exit code $filter_exit_code."
            exit "$filter_exit_code"
          fi
          if [[ $exit_code -eq 1 ]]; then
            echo "::error::Terraform plan failed. Review the filtered diagnostic summary above."
            exit 1
          fi
          [[ $exit_code -eq 2 ]] && has_changes=true || has_changes=false
          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"

      - name: Initialize External ID directory state
        working-directory: bootstrap/external-directory
        shell: bash
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$EXTERNAL_DIRECTORY_STATE_KEY" \
            -backend-config="tenant_id=$ARM_TENANT_ID" \
            -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID" \
            -backend-config="use_azuread_auth=true"

      - name: Create External ID directory saved plan
        id: external_directory_plan
        working-directory: bootstrap/external-directory
        shell: bash
        env:
          TF_VAR_environment: ${{ needs.quality.outputs.environment }}
        run: |
          set -euo pipefail
          set +e
          terraform plan -input=false -json -detailed-exitcode -lock-timeout=5m \
            -out=../../plan/external-directory.tfplan | jq --unbuffered -r '
              if .type == "refresh_start" or
                 .type == "refresh_complete" or
                 .type == "planned_change" or
                 .type == "change_summary" then
                .["@message"] // empty
              elif .type == "diagnostic" then
                "Terraform \(.diagnostic.severity): \(.diagnostic.summary // "unspecified diagnostic")\nResource: \(.diagnostic.address // "not reported")"
              else
                empty
              end
            '
          pipeline_status=("${PIPESTATUS[@]}")
          exit_code=${pipeline_status[0]}
          filter_exit_code=${pipeline_status[1]}
          set -e
          if [[ $filter_exit_code -ne 0 ]]; then
            echo "::error::The External ID plan event filter failed with exit code $filter_exit_code."
            exit "$filter_exit_code"
          fi
          if [[ $exit_code -eq 1 ]]; then
            echo "::error::External ID directory plan failed. Review the filtered diagnostic summary above."
            exit 1
          fi
          [[ $exit_code -eq 2 ]] && has_changes=true || has_changes=false
          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"

      - name: Create value-free plan summary
        id: summary
        shell: bash
        env:
          HAS_CHANGES: ${{ steps.create.outputs.has_changes }}
          DEPLOY_ENVIRONMENT: ${{ needs.quality.outputs.environment }}
        run: |
          set -euo pipefail
          terraform show -json plan/tfplan > "$RUNNER_TEMP/tfplan.json"
          create_count=$(jq '[.resource_changes[]? | select(.change.actions == ["create"])] | length' "$RUNNER_TEMP/tfplan.json")
          update_count=$(jq '[.resource_changes[]? | select(.change.actions == ["update"])] | length' "$RUNNER_TEMP/tfplan.json")
          replace_count=$(jq '[.resource_changes[]? | select((.change.actions | index("create")) != null and (.change.actions | index("delete")) != null)] | length' "$RUNNER_TEMP/tfplan.json")
          destroy_count=$(jq '[.resource_changes[]? | select((.change.actions | index("delete")) != null)] | length' "$RUNNER_TEMP/tfplan.json")
          jq -r '
            .resource_changes[]?
            | select(.change.actions != ["no-op"])
            | "\(.change.actions | join("/"))\t\(.address)"
          ' "$RUNNER_TEMP/tfplan.json" | sort > plan/resource-actions.txt
          {
            echo "### Terraform plan"
            echo "- Environment: \`$DEPLOY_ENVIRONMENT\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Create: $create_count"
            echo "- Update: $update_count"
            echo "- Replace: $replace_count"
            echo "- Includes delete: $destroy_count"
            [[ $destroy_count -eq 0 ]] || echo "- **Destructive change detected: review before approval.**"
            echo
            echo "#### Resource actions (values omitted)"
            echo '```text'
            if [[ -s plan/resource-actions.txt ]]; then
              cat plan/resource-actions.txt
            else
              echo "No resource changes."
            fi
            echo '```'
          } > plan/plan-summary.md
          cat plan/plan-summary.md
          cat plan/plan-summary.md >> "$GITHUB_STEP_SUMMARY"
          (cd plan && sha256sum tfplan > tfplan.sha256)
          jq -n --arg commit "$GITHUB_SHA" --arg environment "$DEPLOY_ENVIRONMENT" \
            --arg version "$TERRAFORM_VERSION" --arg state_key "$TFSTATE_KEY" \
            --arg external_directory_state_key "$EXTERNAL_DIRECTORY_STATE_KEY" \
            '{commit: $commit, environment: $environment, terraform_version: $version, state_key: $state_key, external_directory_state_key: $external_directory_state_key}' \
            > plan/manifest.json
          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/tfplan.json"

      - name: Create External ID directory plan summary
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ needs.quality.outputs.environment }}
        run: |
          set -euo pipefail
          terraform -chdir=bootstrap/external-directory show -json ../../plan/external-directory.tfplan > "$RUNNER_TEMP/external-directory-plan.json"
          create_count=$(jq '[.resource_changes[]? | select(.change.actions == ["create"])] | length' "$RUNNER_TEMP/external-directory-plan.json")
          update_count=$(jq '[.resource_changes[]? | select(.change.actions == ["update"])] | length' "$RUNNER_TEMP/external-directory-plan.json")
          replace_count=$(jq '[.resource_changes[]? | select((.change.actions | index("create")) != null and (.change.actions | index("delete")) != null)] | length' "$RUNNER_TEMP/external-directory-plan.json")
          destroy_count=$(jq '[.resource_changes[]? | select((.change.actions | index("delete")) != null)] | length' "$RUNNER_TEMP/external-directory-plan.json")
          jq -r '
            .resource_changes[]?
            | select(.change.actions != ["no-op"])
            | "\(.change.actions | join("/"))\t\(.address)"
          ' "$RUNNER_TEMP/external-directory-plan.json" | sort > plan/external-directory-actions.txt
          {
            echo "### External ID directory plan"
            echo "- Environment: \`$DEPLOY_ENVIRONMENT\`"
            echo "- Create: $create_count"
            echo "- Update: $update_count"
            echo "- Replace: $replace_count"
            echo "- Includes delete: $destroy_count"
            [[ $destroy_count -eq 0 ]] || echo "- **Destructive directory change detected: review before approval.**"
            echo
            echo '```text'
            if [[ -s plan/external-directory-actions.txt ]]; then
              cat plan/external-directory-actions.txt
            else
              echo "No resource changes."
            fi
            echo '```'
          } > plan/external-directory-summary.md
          cat plan/external-directory-summary.md
          cat plan/external-directory-summary.md >> "$GITHUB_STEP_SUMMARY"
          (cd plan && sha256sum external-directory.tfplan > external-directory.tfplan.sha256)
          rm -f "$RUNNER_TEMP/external-directory-plan.json"

      - name: Upload saved plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-plan-${{ needs.quality.outputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: plan/
          if-no-files-found: error
          retention-days: 2

  apply:
    name: Apply ${{ needs.quality.outputs.environment }}
    if: >-
      github.event_name != 'pull_request' &&
      needs.plan.result == 'success' &&
      (needs.plan.outputs.has_changes == 'true' ||
       needs.plan.outputs.external_directory_has_changes == 'true')
    needs: [quality, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ needs.quality.outputs.environment }}
    concurrency:
      group: terraform-apply-${{ needs.quality.outputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
      TFSTATE_KEY: ${{ vars.TFSTATE_KEY }}
      TF_VAR_external_tenant_id: ${{ vars.EXTERNAL_TENANT_ID }}
      TF_VAR_external_directory_client_id: ${{ vars.EXTERNAL_DIRECTORY_CLIENT_ID }}
      TF_VAR_use_oidc: "true"
      TF_VAR_tenant_subdomain: ${{ vars.EXTERNAL_TENANT_SUBDOMAIN }}
      TF_VAR_tenant_data_location: ${{ vars.EXTERNAL_TENANT_DATA_LOCATION }}
      TF_VAR_mobile_redirect_uri: ${{ vars.MOBILE_REDIRECT_URI }}
      TF_VAR_google_identity_provider_id: ${{ vars.GOOGLE_IDENTITY_PROVIDER_ID }}
      TF_VAR_apple_identity_provider_id: ${{ vars.APPLE_IDENTITY_PROVIDER_ID }}
    steps:
      - name: Check out planned commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Verify environment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID \
            TFSTATE_RESOURCE_GROUP TFSTATE_STORAGE_ACCOUNT TFSTATE_CONTAINER TFSTATE_KEY \
            TF_VAR_external_tenant_id TF_VAR_external_directory_client_id \
            TF_VAR_tenant_subdomain TF_VAR_tenant_data_location TF_VAR_mobile_redirect_uri \
            TF_VAR_google_identity_provider_id TF_VAR_apple_identity_provider_id; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required apply environment variable $name is not configured."
              exit 1
            fi
          done
          echo "TF_VAR_tenant_primary_domain=${TF_VAR_tenant_subdomain}.onmicrosoft.com" >> "$GITHUB_ENV"
          echo "EXTERNAL_DIRECTORY_STATE_KEY=olga/external-directory/${{ needs.quality.outputs.environment }}.tfstate" >> "$GITHUB_ENV"

      - name: Sign in to Azure with OIDC
        uses: Azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize matching remote state
        shell: bash
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$TFSTATE_KEY" \
            -backend-config="use_azuread_auth=true"

      - name: Initialize matching External ID directory state
        working-directory: bootstrap/external-directory
        shell: bash
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$EXTERNAL_DIRECTORY_STATE_KEY" \
            -backend-config="tenant_id=$ARM_TENANT_ID" \
            -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID" \
            -backend-config="use_azuread_auth=true"

      - name: Download saved plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terraform-plan-${{ needs.quality.outputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: plan

      - name: Verify plan provenance
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ needs.quality.outputs.environment }}
        run: |
          set -euo pipefail
          [[ "$(jq -r .commit plan/manifest.json)" == "$GITHUB_SHA" ]]
          [[ "$(jq -r .environment plan/manifest.json)" == "$DEPLOY_ENVIRONMENT" ]]
          [[ "$(jq -r .terraform_version plan/manifest.json)" == "$TERRAFORM_VERSION" ]]
          [[ "$(jq -r .state_key plan/manifest.json)" == "$TFSTATE_KEY" ]]
          [[ "$(jq -r .external_directory_state_key plan/manifest.json)" == "$EXTERNAL_DIRECTORY_STATE_KEY" ]]
          (cd plan && sha256sum --check --strict tfplan.sha256)
          (cd plan && sha256sum --check --strict external-directory.tfplan.sha256)

      - name: Apply exact saved plan
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ needs.quality.outputs.environment }}
        run: |
          set -euo pipefail
          set +e
          terraform apply -input=false -json -lock-timeout=10m plan/tfplan | jq --unbuffered -r '
            if .type == "refresh_start" or
               .type == "refresh_complete" or
               .type == "apply_start" or
               .type == "apply_progress" or
               .type == "apply_complete" or
               .type == "apply_errored" or
               .type == "change_summary" then
              .["@message"] // empty
            elif .type == "diagnostic" then
              "Terraform \(.diagnostic.severity): \(.diagnostic.summary // "unspecified diagnostic")\nResource: \(.diagnostic.address // "not reported")"
            else
              empty
            end
          '
          pipeline_status=("${PIPESTATUS[@]}")
          exit_code=${pipeline_status[0]}
          filter_exit_code=${pipeline_status[1]}
          set -e
          if [[ $filter_exit_code -ne 0 ]]; then
            echo "::error::The Terraform apply event filter failed with exit code $filter_exit_code."
            exit "$filter_exit_code"
          fi
          if [[ $exit_code -eq 0 ]]; then
            echo "Applied the reviewed \`$DEPLOY_ENVIRONMENT\` plan." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Terraform apply failed with exit code $exit_code. Review the filtered diagnostic summary above."
            exit "$exit_code"
          fi

      - name: Apply exact External ID directory saved plan
        working-directory: bootstrap/external-directory
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ needs.quality.outputs.environment }}
          TF_VAR_environment: ${{ needs.quality.outputs.environment }}
        run: |
          set -euo pipefail
          set +e
          terraform apply -input=false -json -lock-timeout=10m ../../plan/external-directory.tfplan | jq --unbuffered -r '
            if .type == "refresh_start" or
               .type == "refresh_complete" or
               .type == "apply_start" or
               .type == "apply_progress" or
               .type == "apply_complete" or
               .type == "apply_errored" or
               .type == "change_summary" then
              .["@message"] // empty
            elif .type == "diagnostic" then
              "Terraform \(.diagnostic.severity): \(.diagnostic.summary // "unspecified diagnostic")\nResource: \(.diagnostic.address // "not reported")"
            else
              empty
            end
          '
          pipeline_status=("${PIPESTATUS[@]}")
          exit_code=${pipeline_status[0]}
          filter_exit_code=${pipeline_status[1]}
          set -e
          if [[ $filter_exit_code -ne 0 ]]; then
            echo "::error::The External ID apply event filter failed with exit code $filter_exit_code."
            exit "$filter_exit_code"
          fi
          if [[ $exit_code -eq 0 ]]; then
            echo "Applied the reviewed External ID directory \`$DEPLOY_ENVIRONMENT\` plan." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::External ID directory apply failed with exit code $exit_code. Review the filtered diagnostic summary above."
            exit "$exit_code"
          fi

      - name: Publish application deployment identities
        shell: bash
        run: |
          set -euo pipefail
          core_client_id=$(terraform output -raw core_deployment_identity_client_id)
          core_subject=$(terraform output -raw core_deployment_oidc_subject)
          nlp_client_id=$(terraform output -raw nlp_deployment_identity_client_id)
          nlp_subject=$(terraform output -raw nlp_deployment_oidc_subject)
          database_client_id=$(terraform output -raw database_deployment_identity_client_id)
          database_subject=$(terraform output -raw database_deployment_oidc_subject)
          {
            echo
            echo "### Application GitHub OIDC"
            echo "- Core \`AZURE_CLIENT_ID\`: \`$core_client_id\`"
            echo "- Core subject: \`$core_subject\`"
            echo "- NLP \`AZURE_CLIENT_ID\`: \`$nlp_client_id\`"
            echo "- NLP subject: \`$nlp_subject\`"
            echo "- Database \`AZURE_CLIENT_ID\`: \`$database_client_id\`"
            echo "- Database subject: \`$database_subject\`"
          } >> "$GITHUB_STEP_SUMMARY"

  fork-plan-notice:
    name: Fork plan policy
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Cloud plans are disabled for fork pull requests because untrusted code must not receive Azure OIDC tokens."
